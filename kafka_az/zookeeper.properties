# dataDir: Essential for defining where ZooKeeper's persistent data is stored. Without this, ZooKeeper won't function.
# Highly important. Without setting this directory, ZooKeeper won't know where to store its data, and it won't be able to start or function correctly.
dataDir=/var/lib/zookeeper

#clientPort: This property specifies the port on which the ZooKeeper server will listen for client connections. The default port for ZooKeeper is 2181.
#Important. It defines the port through which clients will connect to the ZooKeeper server. If you don't specify it, ZooKeeper will use the default port (2181), but explicitly defining it
# can avoid potential conflicts with other services
clientPort=2181
#maxClientCnxns: This property limits the number of concurrent connections that a single client (identified by IP address) can make to the ZooKeeper server. The default is usually 60.
# Importance: Important for controlling resource usage and preventing a single client from overwhelming the server with connections. This setting helps in maintaining stability
# and ensuring fair usage among multiple clients.
maxClientCnxnx=60
