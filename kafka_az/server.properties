#Description :Specifies the directory where kafka will store its log files
log.dirs=/var/lib/kafka
#Description : specifies the connection string for zookeeper ensemble used by kafka brokers
#This property defines the connection string to connect to the Zookeeper ensemble.
#In this setting localhost indicates that zookeeper is running on the local machine and listening to port 2181
#In production envirment, you would typically provide the connection string for your Zookeeper ensemble. This properity is the deafult 
Zookeeper.connect=localhost:2181
